limit_req_zone $binary_remote_addr zone=domly_auth:10m rate=10r/m;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

upstream domly_app {
    server unix:/run/domly/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name domly.site www.domly.site;

    client_max_body_size 110M;

    location /static/ {
        alias /srv/domly/repo/domly/staticfiles/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/domly/repo/domly/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(?:tg/|en/)?auth/login/$ {
        limit_req zone=domly_auth burst=5 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://domly_app;
    }

    location = /admin/login/ {
        limit_req zone=domly_auth burst=5 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://domly_app;
    }

    location = /health/ {
        access_log off;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://domly_app;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
        proxy_pass http://domly_app;
    }
}
