<dialog data-delete-dialog aria-labelledby="delete-chat-title" aria-describedby="delete-chat-description" class="m-auto w-[calc(100%-2rem)] max-w-sm overflow-hidden rounded-2xl bg-white p-0 text-gray-950 shadow-2xl backdrop:bg-black/60">
    <div class="p-5 sm:p-6">
        <div class="flex h-11 w-11 items-center justify-center rounded-full bg-red-50 text-red-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>
        </div>
        <h2 id="delete-chat-title" class="mt-4 text-lg font-semibold">Удалить чат?</h2>
        <p id="delete-chat-description" class="mt-2 text-sm leading-5 text-gray-500">Чат и старая переписка исчезнут только у вас. У собеседника сообщения сохранятся.</p>
        <p class="mt-2 text-xs leading-5 text-gray-400">Если собеседник напишет снова, чат появится без удалённой истории.</p>
        <div class="mt-6 grid grid-cols-2 gap-3">
            <button data-delete-cancel type="button" class="rounded-xl border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50">Отмена</button>
            <button data-delete-confirm type="button" class="rounded-xl bg-red-600 px-4 py-3 text-sm font-medium text-white transition hover:bg-red-700">Удалить</button>
        </div>
    </div>
</dialog>
