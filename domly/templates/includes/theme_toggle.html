{% load i18n %}
<button
    type="button"
    data-theme-toggle
    data-enable-dark-label="{% translate 'Включить тёмную тему' %}"
    data-enable-light-label="{% translate 'Включить светлую тему' %}"
    aria-pressed="false"
    title="{% translate 'Включить тёмную тему' %}"
    aria-label="{% translate 'Включить тёмную тему' %}"
    class="flex items-center justify-center rounded-full transition hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70 {% if placement == 'mobile' %}h-9 w-9 border border-gray-200 bg-white text-gray-600 shadow-sm hover:bg-gray-50 focus-visible:ring-gray-400{% else %}h-7 w-7 text-gray-200 hover:text-white{% endif %}"
>
    <svg data-theme-icon="dark" xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
    </svg>
    <svg data-theme-icon="light" xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
    </svg>
</button>
