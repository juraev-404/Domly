{% load i18n %}
<div class="grid grid-cols-2 gap-3 md:grid-cols-5">
    <label class="block">
        <span class="mb-1.5 hidden text-xs font-medium text-gray-500 md:block">{% translate "Комнаты" %}</span>
        <select name="rooms" aria-label="{% translate 'Комнаты' %}" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-gray-500">
            <option value="">{% translate "Комнаты" %}</option>
            <option value="1" {% if rooms == "1" %}selected{% endif %}>1</option>
            <option value="2" {% if rooms == "2" %}selected{% endif %}>2</option>
            <option value="3" {% if rooms == "3" %}selected{% endif %}>3</option>
            <option value="4" {% if rooms == "4" %}selected{% endif %}>4</option>
            <option value="5_plus" {% if rooms == "5_plus" %}selected{% endif %}>{% translate "5 и больше" %}</option>
        </select>
    </label>
    <label class="block">
        <span class="mb-1.5 hidden text-xs font-medium text-gray-500 md:block">{% translate "Площадь от" %}</span>
        <input type="number" min="0" step="0.01" name="min_area" value="{{ min_area }}" placeholder="{% translate 'Площадь от' %}" aria-label="{% translate 'Площадь от' %}" class="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-sm outline-none focus:border-gray-500">
    </label>
    <label class="block">
        <span class="mb-1.5 hidden text-xs font-medium text-gray-500 md:block">{% translate "Площадь до" %}</span>
        <input type="number" min="0" step="0.01" name="max_area" value="{{ max_area }}" placeholder="{% translate 'Площадь до' %}" aria-label="{% translate 'Площадь до' %}" class="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-sm outline-none focus:border-gray-500">
    </label>
    <label class="block">
        <span class="mb-1.5 hidden text-xs font-medium text-gray-500 md:block">{% translate "Этаж от" %}</span>
        <input type="number" min="0" step="1" name="min_floor" value="{{ min_floor }}" placeholder="{% translate 'Этаж от' %}" aria-label="{% translate 'Этаж от' %}" class="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-sm outline-none focus:border-gray-500">
    </label>
    <label class="block">
        <span class="mb-1.5 hidden text-xs font-medium text-gray-500 md:block">{% translate "Этаж до" %}</span>
        <input type="number" min="0" step="1" name="max_floor" value="{{ max_floor }}" placeholder="{% translate 'Этаж до' %}" aria-label="{% translate 'Этаж до' %}" class="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-sm outline-none focus:border-gray-500">
    </label>
</div>
